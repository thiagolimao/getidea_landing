options:
  formatter: stylish
files:
  include: 'src/assets/scss/**/*.scss'
rules:
  bem-naming: 
    - 1
    - convention: hyphenatedBEM
  border-zero:
    - 1
    - convention: zero
  class-name-format:
    - 1
    - convention: hyphenatedlowercase
  clean-import-paths:
    - 1
    - filename-extension: false
      leading-underscore: false
  empty-line-between-blocks:
    - 1
    - include: true
  extends-before-mixins: 1
  extends-before-declarations: 1
  hex-notation:
    - 1
    - style: lowercase
  indentation:
    - 1
    - size: 2
  leading-zero:
    - 1
    - include: false
  max-line-length:
    - 1
    - length: 120
  mixins-before-declarations: 1
  nesting-depth:
    - 1
    - max-depth: 4
  property-sort-order:
    - 1
    - order: smacss
  quotes:
    - 1
    - style: single
  variable-for-property: 1
